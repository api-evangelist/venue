aid: venue
name: Venue
description: 'Venue is an all-in-one internal communications platform that makes it easy for teams to
  host, organize, and share all hands, webinars, AMAs, and fireside chats. It combines HD live streaming,
  recording, automatic transcription and summarization, branded Q&A, engagement tracking, and Channels
  for centralizing events and videos. Aimed at internal comms and employer-brand teams at companies like
  Shopify, PwC, Wealthsimple, and Yelp, Venue is a Toronto-based, Accel- and Y Combinator-backed
  productivity company. As of this enrichment pass Venue publishes no public developer API, SDK, or API
  documentation surface — this profile captures its identity, website properties, and domain security
  posture.'
